    <style>
        html {
            width: 100%;
            height: 100%
        }

        .container {
            display: inline-block;
            text-align: center;

        }

        h1 {
            color: white !important;
            font-family: 'sacramento', cursive;
            font-size: 3rem;
            font-size: clamp(5rem, 5vw, 3rem);
            white-space: normal;
            overflow: hidden;
            max-width: 22ch;
            font-weight: bold;
            margin: 0 auto;
            width: 0 100%;
            animation:
                typing 3.5s steps(30, end) forwards,
                blink-caret 0.75s step-end infinite;
        }

        /* Animation to reveal text character by character */
        @keyframes typing {
            from {
                clip-path: inset(0 100% 0 0);
            }

            to {
                clip-path: inset(0 0 0 0);
            }
        }

        .header {

            text-align: center;
            color: #FFFAF3;
            justify-content: center;
        }

        .top-container {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 100vh;
        }

        .middle-container {
            display: flex;
            justify-content: center;
        }

        .bottom-container {
            width: 100%;
            height: 100%;
            text-align: center;
            color: white;
            background: linear-gradient(90deg,
                    #2235e5,
                    hsl(0, 67%, 38%),
                    #000000);
        }

        .card {
            background-size: cover;
            background-repeat: no-repeat;
            aspect-ratio: 1/1;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
        }

        .card>div {
            position: relative;
            z-index: 2;
        }

        .btn {
            background: linear-gradient(135deg,
                    #2235e5,
                    hsl(0, 100%, 64%),
                    #000000);
            border: none;
            transition: all 0.3s ease;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(250, 64, 64, 0.5);
        }

        .nac-link svg{
            border: none;
            transition: all 0.3s ease;
            background: transparent;
            margin: 0;

        }

        .nav-link:hover {
            background: transparent !important;
            transform: translateY(-5px);

        }

        .nav-link:hover svg {
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
        }
    </style>

</head>
